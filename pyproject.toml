[project]
name = "recebako"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kazuma", email = "kazuma72521@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "uvicorn>=0.39.0",
    "watchdog>=6.0.0",
]

[project.scripts]
recebako = "recebako:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]
